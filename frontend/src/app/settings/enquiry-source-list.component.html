<div class="settings-container">
    <header class="settings-header">
        <div class="header-info">
            <h1>Enquiry Source Management</h1>
            <p>Manage lead sources (e.g. Social Media, Referral, Walk-in).</p>
        </div>
        <button class="btn btn-primary" (click)="openModal()">
            <span class="icon">➕</span> Add New Source
        </button>
    </header>

    <div class="grid-card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Source Name</th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let s of sources">
                    <td>#{{s.source_id}}</td>
                    <td class="font-bold">{{s.source_name}}</td>
                    <td class="text-right">
                        <button class="icon-btn edit-btn" (click)="openModal(s)" title="Edit">✏️</button>
                        <button class="icon-btn delete-btn" (click)="onDelete(s.source_id)" title="Delete">🗑️</button>
                    </td>
                </tr>
                <tr *ngIf="sources.length === 0">
                    <td colspan="3" class="text-center py-20 t-muted">No enquiry sources found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content settings-modal">
        <div class="modal-header">
            <h3>{{currentSource.source_id ? 'Edit' : 'Add New'}} Enquiry Source</h3>
            <button class="close-modal" (click)="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Source Name <span class="required">*</span></label>
                <input type="text" [(ngModel)]="currentSource.source_name" placeholder="e.g. Facebook, Instagram, etc."
                    class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
            <button class="btn btn-save" (click)="onSave()">{{currentSource.source_id ? 'Update' : 'Create'}}
                Source</button>
        </div>
    </div>
</div>
