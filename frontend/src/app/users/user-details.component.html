<div class="user-details-container">
    <div class="header-actions">
        <h2>User Details</h2>
        <div class="top-btns">
            <button class="btn btn-blue" (click)="onDuplicate()">Duplicate</button>
            <button class="btn btn-green" (click)="onSave()">Save</button>
            <button class="btn btn-gray" (click)="onClose()">Close</button>
        </div>
    </div>

    <div class="details-grid">
        <!-- LEFT SIDE: User Information -->
        <div class="user-info-section card">
            <h3>User Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>User Name *</label>
                    <input type="text" [(ngModel)]="user.username" required placeholder="Unique username">
                </div>
                <div class="form-group">
                    <label>Password <small *ngIf="user.id">(Leave blank to keep current)</small></label>
                    <input type="password" [(ngModel)]="user.password"
                        [placeholder]="user.id ? '••••••••' : 'Enter password'">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" [(ngModel)]="user.confirmPassword" placeholder="Re-type password">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" [(ngModel)]="user.email">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" [(ngModel)]="user.mobile">
                </div>
                <div class="form-group">
                    <label>User Type</label>
                    <select [(ngModel)]="user.userType">
                        <option value="Admin">Admin</option>
                        <option value="Manager">Manager</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select [(ngModel)]="user.status">
                        <option value="Working">Working</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <select [(ngModel)]="user.branchId">
                        <option [value]="null">Select Branch</option>
                        <option *ngFor="let b of branches" [value]="b.branch_id">{{b.branch_name}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>User Role</label>
                    <input type="text" [(ngModel)]="user.userRole">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select [(ngModel)]="user.departmentId">
                        <option [value]="null">Select Department</option>
                        <option *ngFor="let d of departments" [value]="d.department_id">{{d.department_name}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Backup User</label>
                    <input type="text" [(ngModel)]="user.backupUser">
                </div>
                <div class="form-group">
                    <label>Extension Number</label>
                    <input type="text" [(ngModel)]="user.extension">
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" [(ngModel)]="user.allTimeView"> All Time View
                    </label>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE: Permissions -->
        <div class="permissions-section">
            <div class="card">
                <h3>Document-Wise Permissions (Branch & Dept)</h3>
                <div class="table-scroll">
                    <table class="perm-table">
                        <thead>
                            <tr>
                                <th>Sl.No</th>
                                <th>Branch Name</th>
                                <th>Department Name</th>
                                <th>View</th>
                                <th>View All</th>
                                <th>Transfer</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let p of branchPermissions; let i = index">
                                <td>{{i + 1}}</td>
                                <td>{{p.branchName}}</td>
                                <td>{{p.deptName}}</td>
                                <td><input type="checkbox" [(ngModel)]="p.view"></td>
                                <td><input type="checkbox" [(ngModel)]="p.viewAll"></td>
                                <td><input type="checkbox" [(ngModel)]="p.transfer"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card mt-20">
                <h3>Page-Wise Permissions</h3>
                <div class="table-scroll">
                    <table class="perm-table">
                        <thead>
                            <tr>
                                <th>Sl.No</th>
                                <th>Menu Name</th>
                                <th>View</th>
                                <th>Save</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let p of pagePermissions; let i = index">
                                <td>{{i + 1}}</td>
                                <td>{{p.menuName}}</td>
                                <td><input type="checkbox" [(ngModel)]="p.view"></td>
                                <td><input type="checkbox" [(ngModel)]="p.save"></td>
                                <td><input type="checkbox" [(ngModel)]="p.edit"></td>
                                <td><input type="checkbox" [(ngModel)]="p.delete"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
